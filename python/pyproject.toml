[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "qevedo-compiler"
version = "0.2.3"
description = "QCC, the Quantum Compiler Collection: a technology-agnostic quantum circuit compiler (qevedo.compiler)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = [
    "quantum", "compiler", "openqasm", "transpiler", "gate synthesis",
    "multi-core", "modular quantum computing", "distributed quantum computing",
    "qubit mapping", "qubit routing", "hungarian qubit assignment", "sabre",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "PyYAML>=6.0",
    "numpy>=1.24",
    "openqasm>=3,<4",
]

[project.optional-dependencies]
# The synthesis tests check results against the qvd simulator.
dev = ["pytest>=7.0", "qevedo-simulator>=0.1"]
# The Qiskit transpiler plugin (qevedo.compiler.qiskit_plugin).
qiskit = ["qiskit>=1.3"]

[project.scripts]
qcc = "qevedo.compiler.cli:main"

# transpile(circuit, backend, optimization_method="qcc") in Qiskit.
[project.entry-points."qiskit.transpiler.optimization"]
qcc = "qevedo.compiler.qiskit_plugin:QCCPlugin"

[project.urls]
Homepage = "https://github.com/qevedo/qcc"
Repository = "https://github.com/qevedo/qcc"
Documentation = "https://github.com/qevedo/qcc/blob/master/docs/MULTICORE.md"

[tool.maturin]
# The Rust core (../core, through the bindings in src/) is the module
# qevedo.compiler._core. `qevedo` is a namespace package shared with
# qevedo-simulator: no qevedo/__init__.py here.
python-source = "."
module-name = "qevedo.compiler._core"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
