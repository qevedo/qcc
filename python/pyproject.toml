[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qevedo-compiler"
version = "0.1.1"
description = "QCC, the Quantum Compiler Collection: a technology-agnostic quantum circuit compiler (qevedo.compiler)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "numpy>=1.24",
    "openqasm>=3,<4",
]

[project.optional-dependencies]
# The synthesis tests check results against the qvd simulator.
dev = ["pytest>=7.0", "qevedo-simulator>=0.1"]

[project.scripts]
qcc = "qevedo.compiler.cli:main"

[project.urls]
Homepage = "https://github.com/qevedo/qevedo-compiler"
Repository = "https://github.com/qevedo/qevedo-compiler"

# `qevedo` is a namespace package (no __init__.py) shared with the other
# Qevedo packages, such as qevedo-simulator.
[tool.setuptools.packages.find]
where = ["."]
include = ["qevedo.compiler*"]
namespaces = true

[tool.setuptools.package-data]
"qevedo.compiler" = ["profiles/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
