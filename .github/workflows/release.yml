name: Release

# Publish qevedo-compiler to PyPI when a version tag (vX.Y.Z) is pushed. The
# tag must match the version in python/pyproject.toml and python/Cargo.toml,
# and the tests must pass. The package contains the Rust core
# (qevedo.compiler._core), so it ships one abi3 wheel per platform.
#
# Publishing uses PyPI trusted publishing: on pypi.org, add a (pending) trusted
# publisher for project "qevedo-compiler", owner "qevedo", repository "qevedo-compiler",
# workflow "release.yml", environment "pypi". No API token is stored in GitHub.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

jobs:
  test:
    uses: ./.github/workflows/python.yml

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check the tag against the versions
        working-directory: python
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          crate=$(python -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['package']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ] || [ "$crate" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME, pyproject.toml $version and Cargo.toml $crate must agree"
            exit 1
          fi

  wheels:
    needs: [test, check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64 }
          - { os: ubuntu-latest, target: aarch64 }
          - { os: macos-latest, target: aarch64 }
          - { os: macos-latest, target: x86_64 }
          - { os: windows-latest, target: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - name: Check the x86-64 Linux wheel
        if: matrix.os == 'ubuntu-latest' && matrix.target == 'x86_64'
        run: |
          python -m pip install python/dist/*.whl
          python -c "from qevedo.compiler import compile_source; from qevedo.compiler.passes import native; assert native.available(); print(compile_source('OPENQASM 3.0; include \"stdgates.inc\"; qubit[2] q; swap q[0], q[1];').gate_counts())"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: python/dist/

  sdist:
    needs: [test, check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: python/dist/

  publish:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/qevedo-compiler/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
